<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Admin Dashboard | AURA & CO.</title>
    <script src='https://cdn.tailwindcss.com'></script>
</head>
<body class='bg-white text-gray-900 font-sans antialiased'>
    <header class='border-b border-gray-100 py-6 px-12 flex justify-between items-center bg-white sticky top-0 z-50'>
        <a href='index.html' class='text-xs font-bold tracking-[0.3em] uppercase'>AURA & CO. ADMIN</a>
        <nav class='hidden md:flex space-x-8 text-[11px] tracking-[0.2em] uppercase font-medium text-gray-800'>
            <a href='index.html' class='hover:text-gray-400 transition'>View Store</a>
        </nav>
    </header>

    <main class='max-w-4xl mx-auto py-16 px-6 space-y-12'>
        <h1 class='text-2xl font-light tracking-widest uppercase text-center'>Store Management Dashboard</h1>
        
        <!-- Hero Banner Section -->
        <div class='bg-gray-50 p-8 border border-gray-200 space-y-6'>
            <h3 class='text-xs font-bold uppercase tracking-[0.2em] text-gray-800'>1. Customize Hero Banner Image</h3>
            <div>
                <label class='block text-[10px] font-bold text-gray-700 uppercase tracking-[0.2em] mb-2'>Banner Image Direct URL</label>
                <input type='text' id='banner-url' placeholder='https://images.unsplash.com/...' class='border border-gray-300 p-3.5 text-xs w-full focus:outline-black bg-white'>
            </div>
            <button onclick='updateBanner()' class='w-full bg-black text-white text-[10px] font-bold tracking-[0.25em] uppercase py-3.5 hover:bg-gray-800 transition'>Save & Update Banner</button>
        </div>

        <!-- Add Product Section -->
        <div class='bg-gray-50 p-8 border border-gray-200 space-y-6'>
            <h3 class='text-xs font-bold uppercase tracking-[0.2em] text-gray-800'>2. Add New Product</h3>
            <div class='grid grid-cols-1 md:grid-cols-2 gap-6'>
                <div>
                    <label class='block text-[10px] font-bold text-gray-700 uppercase tracking-[0.2em] mb-2'>Product Name</label>
                    <input type='text' id='prod-name' placeholder='e.g. Silk Evening Gown' class='border border-gray-300 p-3.5 text-xs w-full focus:outline-black bg-white'>
                </div>
                <div>
                    <label class='block text-[10px] font-bold text-gray-700 uppercase tracking-[0.2em] mb-2'>Price (£)</label>
                    <input type='text' id='prod-price' placeholder='150.00' class='border border-gray-300 p-3.5 text-xs w-full focus:outline-black bg-white'>
                </div>
            </div>
            <div class='grid grid-cols-1 md:grid-cols-2 gap-6'>
                <div>
                    <label class='block text-[10px] font-bold text-gray-700 uppercase tracking-[0.2em] mb-2'>Category</label>
                    <select id='prod-category' class='border border-gray-300 p-3.5 text-xs w-full focus:outline-black bg-white uppercase'>
                        <option value='shop'>Shop All</option>
                        <option value='male'>Male Collection</option>
                        <option value='female'>Female Collection</option>
                        <option value='kids'>Kids Collection</option>
                    </select>
                </div>
                <div>
                    <label class='block text-[10px] font-bold text-gray-700 uppercase tracking-[0.2em] mb-2'>Stock Status</label>
                    <select id='prod-stock' class='border border-gray-300 p-3.5 text-xs w-full focus:outline-black bg-white uppercase'>
                        <option value='In Stock'>In Stock</option>
                        <option value='Out of Stock'>Out of Stock</option>
                    </select>
                </div>
            </div>
            <div>
                <label class='block text-[10px] font-bold text-gray-700 uppercase tracking-[0.2em] mb-2'>Image Direct URL</label>
                <input type='text' id='prod-img' placeholder='https://images.unsplash.com/...' class='border border-gray-300 p-3.5 text-xs w-full focus:outline-black bg-white'>
            </div>
            <button onclick='addProduct()' class='w-full bg-black text-white text-[10px] font-bold tracking-[0.25em] uppercase py-3.5 hover:bg-gray-800 transition'>Add Product to Catalog</button>
        </div>

        <!-- Manage Products Section -->
        <div class='bg-gray-50 p-8 border border-gray-200 space-y-6'>
            <h3 class='text-xs font-bold uppercase tracking-[0.2em] text-gray-800'>3. Manage Products (Stock & Delete)</h3>
            <div id='admin-product-list' class='space-y-4'>
                <p class='text-xs text-gray-500 italic'>Loading products...</p>
            </div>
        </div>
    </main>

    <script>
        function updateBanner() {
            const url = document.getElementById('banner-url').value.trim();
            if (url) {
                localStorage.setItem('aura_main_banner', url);
                alert('Hero banner updated successfully!');
            } else {
                alert('Please enter a valid image URL.');
            }
        }

        function addProduct() {
            const name = document.getElementById('prod-name').value.trim();
            const price = document.getElementById('prod-price').value.trim();
            const category = document.getElementById('prod-category').value;
            const stock = document.getElementById('prod-stock').value;
            const img = document.getElementById('prod-img').value.trim();

            if (!name || !price || !img) {
                alert('Please fill out all product fields.');
                return;
            }

            const newProduct = { name, price: '£' + price, category, stock, img };
            let products = JSON.parse(localStorage.getItem('aura_custom_products') || '[]');
            products.push(newProduct);
            localStorage.setItem('aura_custom_products', JSON.stringify(products));

            alert('Product added successfully!');
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-img').value = '';
            loadAdminProducts();
        }

        function loadAdminProducts() {
            const listContainer = document.getElementById('admin-product-list');
            let products = JSON.parse(localStorage.getItem('aura_custom_products') || '[]');
            
            if (products.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-gray-500 italic">No custom products added yet.</p>';
                return;
            }

            let html = '';
            products.forEach((p, index) => {
                let stockClass = p.stock === 'Out of Stock' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700';
                html += '<div class="flex items-center justify-between bg-white p-4 border border-gray-200">' +
                    '<div class="flex items-center space-x-4">' +
                        '<img src="' + p.img + '" class="w-12 h-12 object-cover">' +
                        '<div>' +
                            '<h4 class="text-xs font-bold uppercase">' + p.name + '</h4>' +
                            '<p class="text-[11px] text-gray-500">' + p.price + ' &bull; ' + p.category.toUpperCase() + '</p>' +
                        '</div>' +
                    '</div>' +
                    '<div class="flex items-center space-x-3">' +
                        '<button onclick="toggleStock(' + index + ')" class="text-[10px] px-3 py-1.5 uppercase font-bold tracking-wider ' + stockClass + '">' + p.stock + '</button>' +
                        '<button onclick="deleteProduct(' + index + ')" class="bg-black text-white text-[10px] px-3 py-1.5 uppercase tracking-wider hover:bg-gray-800">Delete</button>' +
                    '</div>' +
                '</div>';
            });
            listContainer.innerHTML = html;
        }

        function toggleStock(index) {
            let products = JSON.parse(localStorage.getItem('aura_custom_products') || '[]');
            products[index].stock = products[index].stock === 'Out of Stock' ? 'In Stock' : 'Out of Stock';
            localStorage.setItem('aura_custom_products', JSON.stringify(products));
            loadAdminProducts();
        }

        function deleteProduct(index) {
            if (confirm('Delete this product?')) {
                let products = JSON.parse(localStorage.getItem('aura_custom_products') || '[]');
                products.splice(index, 1);
                localStorage.setItem('aura_custom_products', JSON.stringify(products));
                loadAdminProducts();
            }
        }

        window.addEventListener('DOMContentLoaded', loadAdminProducts);
    </script>
</body>
</html>
