<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Admin Dashboard | AURA & CO.</title>
    <script src='https://cdn.tailwindcss.com'></script>
</head>
<body class='bg-white text-gray-900 font-sans antialiased'>
    <header class='border-b border-gray-100 py-6 px-12 flex justify-between items-center bg-white sticky top-0 z-50'>
        <a href='index.html' class='text-xs font-bold tracking-[0.3em] uppercase'>AURA & CO. ADMIN</a>
        <nav class='hidden md:flex space-x-10 text-[11px] tracking-[0.2em] uppercase font-medium text-gray-800'>
            <a href='index.html' class='hover:text-gray-400 transition'>View Store</a>
        </nav>
    </header>
    <main class='max-w-xl mx-auto py-20 px-6'>
        <h1 class='text-2xl font-light tracking-widest uppercase mb-10 text-center'>Store Dashboard</h1>
        <div class='bg-gray-50/50 p-10 border border-gray-200 space-y-6'>
            <h3 class='text-xs font-bold uppercase tracking-[0.2em]'>Customize Hero Banner Image</h3>
            <div>
                <label class='block text-[10px] font-bold text-gray-700 uppercase tracking-[0.2em] mb-2'>New Image Direct URL</label>
                <input type='text' id='banner-url' placeholder='https://images.unsplash.com/...' class='border border-gray-300 p-3.5 text-xs w-full focus:outline-black bg-white tracking-wide'>
            </div>
            <button onclick='updateBanner()' class='w-full bg-black text-white text-[10px] font-bold tracking-[0.25em] uppercase py-4 hover:bg-gray-800 transition'>Save & Update Banner</button>
        </div>
    </main>
    <script>
        function updateBanner() {
            const url = document.getElementById('banner-url').value.trim();
            if (url) {
                localStorage.setItem('aura_main_banner', url);
                alert('Hero banner updated successfully! Check the homepage.');
            } else {
                alert('Please paste a valid image URL.');
            }
        }
    </script>
</body>
</html>
