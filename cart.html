<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Cart | AURA & CO.</title>
    <script src='https://cdn.tailwindcss.com'></script>
</head>
<body class='bg-white text-gray-900 font-sans antialiased'>
    <header class='border-b border-gray-100 py-6 px-8 flex justify-between items-center bg-white sticky top-0 z-50'>
        <a href='index.html' class='text-sm font-bold tracking-[0.25em] uppercase'>AURA & CO.</a>
        <nav class='hidden md:flex space-x-8 text-xs tracking-widest uppercase'>
            <a href='index.html' class='hover:text-gray-500 transition'>Home</a>
            <a href='shop.html' class='hover:text-gray-500 transition'>Shop</a>
            <a href='cart.html' class='text-black font-bold transition'>Cart</a>
            <a href='checkout.html' class='hover:text-gray-500 transition'>Checkout</a>
        </nav>
    </header>
    <main class='max-w-2xl mx-auto py-16 px-6'>
        <h1 class='text-2xl font-light tracking-tight uppercase mb-8 text-center'>Your Shopping Bag</h1>
        <div class='border border-gray-200 p-6 space-y-4'>
            <div class='flex justify-between items-center border-b border-gray-100 pb-4'>
                <div>
                    <h3 class='text-xs font-bold uppercase'>Cashmere Overcoat</h3>
                    <p class='text-[11px] text-gray-500'>Qty: 1</p>
                </div>
                <p class='text-xs font-bold'>£240.00</p>
            </div>
            <div class='flex justify-between items-center pt-2'>
                <span class='text-xs font-bold uppercase'>Total</span>
                <span class='text-xs font-bold'>£240.00</span>
            </div>
            <a href='checkout.html' class='block text-center w-full bg-black text-white text-xs font-bold tracking-widest uppercase py-4 hover:bg-gray-800 mt-6'>Proceed to Checkout</a>
        </div>
    </main>
</body>
</html>
