<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Cart | AURA & CO.</title>
    <script src='https://cdn.tailwindcss.com'></script>
</head>
<body class='bg-white text-gray-900 font-sans antialiased'>
    <header class='border-b border-gray-100 py-6 px-12 flex justify-between items-center bg-white sticky top-0 z-50'>
        <a href='index.html' class='text-xs font-bold tracking-[0.3em] uppercase'>AURA & CO.</a>
        <nav class='hidden md:flex space-x-10 text-[11px] tracking-[0.2em] uppercase font-medium text-gray-800'>
            <a href='index.html' class='hover:text-gray-400 transition'>Home</a>
            <a href='shop.html' class='hover:text-gray-400 transition'>Shop</a>
            <a href='cart.html' class='text-black font-bold transition'>Cart</a>
            <a href='checkout.html' class='hover:text-gray-400 transition'>Checkout</a>
            <a href='admin.html' class='text-gray-400 hover:text-black transition'>Admin</a>
        </nav>
    </header>
    <main class='max-w-xl mx-auto py-20 px-6'>
        <h1 class='text-2xl font-light tracking-widest uppercase mb-10 text-center'>Shopping Bag</h1>
        <div class='border border-gray-200 p-8 space-y-6 bg-gray-50/50'>
            <div class='flex justify-between items-center border-b border-gray-200 pb-6'>
                <div>
                    <h3 class='text-xs font-bold uppercase tracking-wider'>Cashmere Overcoat</h3>
                    <p class='text-[11px] text-gray-500 mt-1'>Quantity: 1</p>
                </div>
                <p class='text-xs font-bold tracking-wider'>£240.00</p>
            </div>
            <div class='flex justify-between items-center pt-2'>
                <span class='text-xs font-bold uppercase tracking-widest'>Total</span>
                <span class='text-xs font-bold tracking-wider'>£240.00</span>
            </div>
            <a href='checkout.html' class='block text-center w-full bg-black text-white text-[10px] font-bold tracking-[0.25em] uppercase py-4 hover:bg-gray-800 transition mt-6'>Proceed to Checkout</a>
        </div>
    </main>
</body>
</html>
