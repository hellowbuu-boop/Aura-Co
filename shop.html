<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop All | AURA & CO.</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900 font-sans antialiased">
    <header class="border-b border-gray-100 py-6 px-12 flex justify-between items-center bg-white sticky top-0 z-50">
        <a href="index.html" id="secret-admin-logo" class="text-xs font-bold tracking-[0.3em] uppercase select-none cursor-pointer">AURA & CO.</a>
        <nav class="hidden md:flex space-x-8 text-[11px] tracking-[0.2em] uppercase font-medium text-gray-800">
            <a href="index.html" class="hover:text-gray-400 transition">Home</a>
            <a href="male.html" class="hover:text-gray-400 transition">Male</a>
            <a href="female.html" class="hover:text-gray-400 transition">Female</a>
            <a href="kids.html" class="hover:text-gray-400 transition">Kids</a>
            <a href="shop.html" class="text-black font-bold transition">Shop All</a>
            <a href="cart.html" class="hover:text-gray-400 transition">Cart</a>
            <a href="checkout.html" class="hover:text-gray-400 transition">Checkout</a>
            <span id="admin-badge" class="hidden text-red-600 font-bold tracking-widest bg-red-50 px-2 py-1 text-[9px]">ADMIN MODE ON</span>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto py-20 px-8">
        <div class="flex justify-between items-center mb-12">
            <h1 class="text-2xl font-light tracking-widest uppercase">Shop All Collection</h1>
            <div id="admin-add-btn-container"></div>
        </div>

        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-10">
            <p class="text-xs text-gray-400 col-span-3 text-center uppercase tracking-widest py-10">Loading global collection...</p>
        </div>
    </main>

    <!-- Admin Add/Edit Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-8 max-w-md w-full space-y-4 border border-gray-200">
            <h3 id="modal-title" class="text-xs font-bold uppercase tracking-widest">Add New Product</h3>
            <input type="hidden" id="edit-index" value="-1">
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider mb-1">Product Name</label>
                <input type="text" id="modal-name" class="border border-gray-300 p-3 text-xs w-full bg-white">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider mb-1">Price (£)</label>
                <input type="text" id="modal-price" class="border border-gray-300 p-3 text-xs w-full bg-white">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider mb-1">Category</label>
                <select id="modal-category" class="border border-gray-300 p-3 text-xs w-full bg-white uppercase">
                    <option value="shop">Shop All</option>
                    <option value="male">Male Collection</option>
                    <option value="female">Female Collection</option>
                    <option value="kids">Kids Collection</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider mb-1">Stock Status</label>
                <select id="modal-stock" class="border border-gray-300 p-3 text-xs w-full bg-white uppercase">
                    <option value="In Stock">In Stock</option>
                    <option value="Out of Stock">Out of Stock</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider mb-1">Image URL</label>
                <input type="text" id="modal-img" class="border border-gray-300 p-3 text-xs w-full bg-white">
            </div>
            <div class="flex space-x-4 pt-2">
                <button onclick="saveProductToGitHub()" class="flex-1 bg-black text-white text-[10px] uppercase font-bold tracking-widest py-3">Save Globally</button>
                <button onclick="closeModal()" class="flex-1 bg-gray-200 text-gray-800 text-[10px] uppercase font-bold tracking-widest py-3">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_USER = "hellowbuu-boop";
        const REPO_NAME = "Aura-Co";

        let globalProducts = [];
        let fileSha = "";

        async function fetchProducts() {
            try {
                let res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/products.json?t=` + new Date().getTime());
                let data = await res.json();
                fileSha = data.sha;
                let decodedContent = decodeURIComponent(escape(atob(data.content)));
                globalProducts = JSON.parse(decodedContent);
                renderShop();
            } catch (err) {
                console.error(err);
                document.getElementById('product-grid').innerHTML = '<p class="text-xs text-red-500 col-span-3 text-center uppercase tracking-widest">Failed to load global products.</p>';
            }
        }

        async function updateGitHubFile(updatedProducts, successMessage) {
            const token = localStorage.getItem('github_token');
            if (!token) {
                alert('Admin token missing! Please re-enable admin mode.');
                return;
            }

            try {
                let contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(updatedProducts, null, 4))));
                let res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/products.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'token ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Global sync: update products.json via website admin",
                        content: contentEncoded,
                        sha: fileSha
                    })
                });

                if (res.ok) {
                    let result = await res.json();
                    fileSha = result.content.sha;
                    globalProducts = updatedProducts;
                    alert(successMessage);
                    renderShop();
                } else {
                    alert('Sync failed! Check your token.');
                }
            } catch (err) {
                console.error(err);
                alert('Network error during global sync.');
            }
        }

        function renderShop() {
            const isAdmin = localStorage.getItem('aura_admin_logged') === 'true';
            if (isAdmin) {
                document.getElementById('admin-badge').classList.remove('hidden');
                document.getElementById('admin-add-btn-container').innerHTML = '<button onclick="openModal()" class="bg-black text-white text-[10px] font-bold tracking-widest uppercase px-6 py-3 hover:bg-gray-800">+ Add New Product</button>';
            }

            const grid = document.getElementById('product-grid');
            let html = '';

            globalProducts.forEach((p, index) => {
                let stockBadge = p.stock === 'Out of Stock' ? '<span class="text-[10px] text-red-600 font-bold uppercase tracking-wider block mt-1">Out of Stock</span>' : '';
                
                let adminControls = '';
                if (isAdmin) {
                    let stockToggleText = p.stock === 'Out of Stock' ? 'Make In Stock' : 'Make Out of Stock';
                    adminControls = '<div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center bg-gray-50 p-2">' +
                        '<button onclick="event.stopPropagation(); editProduct(' + index + ');" class="text-[9px] font-bold uppercase tracking-widest bg-blue-600 text-white px-2.5 py-1">Edit</button>' +
                        '<button onclick="event.stopPropagation(); toggleStock(' + index + ');" class="text-[9px] font-bold uppercase tracking-widest ' + (p.stock === 'Out of Stock' ? 'bg-green-600 text-green-100' : 'bg-amber-500 text-white') + ' px-2.5 py-1">' + stockToggleText + '</button>' +
                        '<button onclick="event.stopPropagation(); deleteProduct(' + index + ');" class="text-[9px] font-bold uppercase tracking-widest bg-red-600 text-white px-2.5 py-1">Delete</button>' +
                    '</div>';
                }

                html += '<div class="group border border-gray-100 p-4 bg-white">' +
                    '<div class="overflow-hidden bg-gray-100 mb-4">' +
                        '<img src="' + p.img + '" class="w-full h-96 object-cover group-hover:scale-105 transition duration-500">' +
                    '</div>' +
                    '<h3 class="text-xs uppercase tracking-widest font-medium">' + p.name + '</h3>' +
                    '<p class="text-xs text-gray-500 mt-1">' + p.price + '</p>' +
                    stockBadge +
                    '<button onclick="addToCart(\'' + p.name + '\', \'' + p.price + '\', \'' + p.img + '\')" class="w-full mt-4 bg-black text-white text-[10px] uppercase tracking-[0.2em] py-3 hover:bg-gray-800 transition">Add to Bag</button>' +
                    adminControls +
                '</div>';
            });

            grid.innerHTML = html || '<p class="text-xs text-gray-500 uppercase tracking-widest col-span-3 text-center py-10">No products available.</p>';
        }

        function addToCart(name, price, img) {
            let cart = JSON.parse(localStorage.getItem('aura_cart') || '[]');
            cart.push({ name, price, img });
            localStorage.setItem('aura_cart', JSON.stringify(cart));
            alert('Product added to bag successfully!');
        }

        function openModal(index = -1) {
            document.getElementById('admin-modal').classList.remove('hidden');
            if (index > -1) {
                let p = globalProducts[index];
                document.getElementById('modal-title').innerText = 'Edit Product';
                document.getElementById('edit-index').value = index;
                document.getElementById('modal-name').value = p.name;
                document.getElementById('modal-price').value = p.price.replace('£', '');
                document.getElementById('modal-category').value = p.category;
                document.getElementById('modal-stock').value = p.stock;
                document.getElementById('modal-img').value = p.img;
            } else {
                document.getElementById('modal-title').innerText = 'Add New Product';
                document.getElementById('edit-index').value = '-1';
                document.getElementById('modal-name').value = '';
                document.getElementById('modal-price').value = '';
                document.getElementById('modal-img').value = '';
            }
        }

        function closeModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        async function saveProductToGitHub() {
            const name = document.getElementById('modal-name').value.trim();
            const price = document.getElementById('modal-price').value.trim();
            const category = document.getElementById('modal-category').value;
            const stock = document.getElementById('modal-stock').value;
            const img = document.getElementById('modal-img').value.trim();
            const editIndex = parseInt(document.getElementById('edit-index').value);

            if (!name || !price || !img) {
                alert('Please fill out all fields.');
                return;
            }

            let updatedList = [...globalProducts];
            let formattedPrice = price.startsWith('£') ? price : '£' + price;

            if (editIndex > -1) {
                updatedList[editIndex] = { name, price: formattedPrice, category, stock, img };
            } else {
                updatedList.push({ name, price: formattedPrice, category, stock, img });
            }

            closeModal();
            document.getElementById('product-grid').innerHTML = '<p class="text-xs text-gray-500 col-span-3 text-center uppercase tracking-widest py-10">Syncing globally with GitHub...</p>';
            await updateGitHubFile(updatedList, 'Product saved and synced globally!');
        }

        async function editProduct(index) {
            openModal(index);
        }

        async function toggleStock(index) {
            let updatedList = [...globalProducts];
            updatedList[index].stock = updatedList[index].stock === 'Out of Stock' ? 'In Stock' : 'Out of Stock';
            await updateGitHubFile(updatedList, 'Stock status updated globally!');
        }

        async function deleteProduct(index) {
            if (confirm('Are you sure you want to delete this product globally?')) {
                let updatedList = [...globalProducts];
                updatedList.splice(index, 1);
                await updateGitHubFile(updatedList, 'Product deleted and synced globally!');
            }
        }

        let tapCount = 0;
        document.getElementById('secret-admin-logo').addEventListener('click', (e) => {
            e.preventDefault();
            tapCount++;
            if (tapCount === 5) {
                let isAdmin = localStorage.getItem('aura_admin_logged') === 'true';
                if (!isAdmin) {
                    let tokenInput = prompt("Enter your GitHub Personal Access Token for global sync:");
                    if (tokenInput && tokenInput.trim() !== "") {
                        localStorage.setItem('github_token', tokenInput.trim());
                        localStorage.setItem('aura_admin_logged', 'true');
                        alert('Admin Mode Enabled successfully!');
                    } else {
                        alert('Valid token is required to enable admin mode.');
                        tapCount = 0;
                        return;
                    }
                } else {
                    localStorage.setItem('aura_admin_logged', 'false');
                    localStorage.removeItem('github_token');
                    alert('Admin Mode Disabled');
                }
                location.reload();
            } else if (tapCount === 1) {
                setTimeout(() => { tapCount = 0; }, 1000);
            }
        });

        window.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
